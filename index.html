<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Crence® — Creative, Film & Marketing</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="wrap">
    <header class="nav">
      <a class="logo" href="#top">crence<sup>®</sup></a>
      <nav class="navlinks"><a href="#work">Work</a><a href="network.html">Network</a><a href="#contact" data-open-contact>Start a project</a></nav>
    </header>
    <main>
      <section class="section" id="work">
        <div class="section-head"><div class="eyebrow">01 / Selected work</div><h2>Ideas, made tangible.</h2></div>
        <div class="projects">
          <article class="project" data-project="tranxact">
            <div class="project-visual"><div class="project-top"><span>TRANXACT</span><span>01</span></div></div>
            <div class="project-title">Tranxact</div>
            <div class="project-meta"><span>Brand · App · Website · Motion</span><span>2026</span></div>
            <div class="project-note">Identity, product design and launch film</div>
          </article>
        </div>
      </section>
    </main>
  </div>
  <div class="project-modal" id="project-modal">
    <div class="project-panel">
      <button class="close" data-close-project>×</button>
      <div class="project-gallery" id="project-gallery"></div>
      <div class="project-info">
        <h2 id="project-modal-title"></h2>
        <div id="project-body"></div>
      </div>
    </div>
  </div>
  <script>
    const projects = {
      tranxact: {
        title: 'Tranxact.',
        body: '<p>Tranxact lets people receive crypto and get naira, send to any bank, pay bills and get paid with a link.</p>',
        media: [
          {type:'img', src:'work/IMG_2050.jpg'},
          {type:'img', src:'work/IMG_2051.jpg'},
          {type:'img', src:'work/IMG_2052.jpg'},
          {type:'img', src:'work/IMG_2053.jpg'},
          {type:'img', src:'work/IMG_2054.jpg'},
          {type:'video', src:'work/tranxact-launch-16x9.mp4'}
        ]
      }
    };
    const modal = document.getElementById('project-modal');
    const gallery = document.getElementById('project-gallery');
    const titleEl = document.getElementById('project-modal-title');
    const bodyEl = document.getElementById('project-body');
    function openProject(id) {
      const d = projects[id]; if (!d) return;
      titleEl.textContent = d.title;
      bodyEl.innerHTML = d.body;
      gallery.innerHTML = d.media.map(m => m.type==='video' ? `<video src="${m.src}" controls playsinline style="width:100%"></video>` : `<img src="${m.src}" style="width:100%">`).join('');
      modal.classList.add('open');
    }
    document.querySelectorAll('[data-project]').forEach(el => el.addEventListener('click', () => openProject(el.dataset.project)));
    document.querySelectorAll('[data-close-project]').forEach(b => b.addEventListener('click', () => modal.classList.remove('open')));
    modal.addEventListener('click', e => { if (e.target === modal) modal.classList.remove('open'); });
  </script>
</body>
</html>
